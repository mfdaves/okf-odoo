name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact release tag, for example v0.1.0"
        required: true
        type: string
      dist_tag:
        description: "npm distribution tag"
        required: true
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The gates validate through the okf-mcp producer host, which is resolved
      # as a sibling directory exactly as in the CI workflow.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          path: okf-odoo

      - uses: actions/checkout@v6
        with:
          repository: mfdaves/okf-mcp
          path: okf-mcp

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: |
            okf-odoo/package-lock.json
            okf-mcp/package-lock.json

      # npm 12: `npm stage publish`, which the trusted publisher allows.
      - run: npm install --global "npm@^12.2.2"
      - run: npm --version

      - run: npm ci
        working-directory: okf-mcp

      - run: npm ci
        working-directory: okf-odoo
      - run: npm run lint
        working-directory: okf-odoo
      - run: npm run format:check
        working-directory: okf-odoo
      - run: npm test
        working-directory: okf-odoo
      - run: npm run self:validate
        working-directory: okf-odoo
      - run: npm run smoke
        working-directory: okf-odoo
      - run: npm run pack:check
        working-directory: okf-odoo

      - name: Verify release identity and stage the release
        shell: bash
        working-directory: okf-odoo
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          if [[ "${NAME}" != "@mfdaves/okf-odoo" ]]; then
            echo "Unexpected npm package identity: ${NAME}." >&2
            exit 1
          fi
          if [[ "${RELEASE_REF}" != "v${VERSION}" ]]; then
            echo "Release ref ${RELEASE_REF} does not match package version ${VERSION}." >&2
            exit 1
          fi
          if [[ "${NPM_DIST_TAG}" == "next" && "${VERSION}" != *-* ]]; then
            echo "The next tag requires a prerelease version." >&2
            exit 1
          fi
          if [[ "${NPM_DIST_TAG}" == "latest" && "${VERSION}" == *-* ]]; then
            echo "The latest tag cannot publish a prerelease version." >&2
            exit 1
          fi
          # Staged, not public: a maintainer approves it with 2FA
          # (`npm stage approve` or npmjs.com) before it is published.
          npm stage publish --access public --provenance --tag "${NPM_DIST_TAG}"
