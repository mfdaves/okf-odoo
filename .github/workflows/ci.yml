name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v6
        with:
          path: okf-odoo
      - uses: actions/checkout@v6
        with:
          repository: mfdaves/okf-mcp
          path: okf-mcp
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            okf-odoo/package-lock.json
            okf-mcp/package-lock.json
      - run: npm ci
        working-directory: okf-mcp
      - run: npm ci
        working-directory: okf-odoo
      - run: npm test
        working-directory: okf-odoo
      - run: npm run self:validate
        working-directory: okf-odoo
      - run: npm run smoke
        working-directory: okf-odoo
      - run: npm run pack:check
        working-directory: okf-odoo

  odoo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        odoo: ["18", "19", "20"]
    steps:
      - uses: actions/checkout@v6
        with:
          path: okf-odoo
      - uses: actions/checkout@v6
        with:
          repository: mfdaves/okf-mcp
          path: okf-mcp
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            okf-odoo/package-lock.json
            okf-mcp/package-lock.json
      - run: npm ci
        working-directory: okf-mcp
      - run: npm ci
        working-directory: okf-odoo
      # Odoo and its Postgres 17 run as one compose project: the database is
      # initialised with base and sale, and the API keys are created through
      # `odoo shell`, which a service container cannot do. The script also
      # exports the protocol: JSON-RPC for Odoo 18, JSON-2 for 19 and 20.
      - name: Start Odoo ${{ matrix.odoo }}
        working-directory: okf-odoo
        run: |
          scripts/live-odoo.sh up "${{ matrix.odoo }}" > "${RUNNER_TEMP}/odoo.env"
          while IFS='=' read -r name value; do
            case "${name}" in
              *API_KEY) echo "::add-mask::${value}" ;;
            esac
          done < "${RUNNER_TEMP}/odoo.env"
          cat "${RUNNER_TEMP}/odoo.env" >> "${GITHUB_ENV}"
      # The replay tests cannot see what a live server returns, so the server is
      # the oracle for the recorded fixtures of the same major version.
      - run: npm run live:shape
        working-directory: okf-odoo
        env:
          OKF_ODOO_LIVE_TEST: "1"
      - run: npm run live:smoke
        working-directory: okf-odoo
        env:
          OKF_ODOO_LIVE_TEST: "1"
      - name: Stop Odoo
        if: always()
        working-directory: okf-odoo
        run: scripts/live-odoo.sh down
